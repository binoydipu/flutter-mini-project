name: mini_project
description: "A beginner-friendly Flutter mini project for learning Supabase authentication."

# Prevents accidental publishing to pub.dev
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

# ──────────────────────────────────────────────────
# DEPENDENCIES - packages our app needs to run
# ──────────────────────────────────────────────────
dependencies:
  flutter:
    sdk: flutter

  # Material Design icons for iOS-style icons
  cupertino_icons: ^1.0.9

  # Supabase Flutter SDK - handles auth, database, storage
  supabase_flutter: ^2.12.4

  # GoRouter - declarative routing for navigation
  go_router: ^17.2.3

  # Google Sign In - native Google OAuth flow
  google_sign_in: ^7.2.0

  # Read .env file for Supabase keys (keeps secrets out of code)
  flutter_dotenv: ^6.0.1

  # To show Loading indicators
  flutter_spinkit: ^5.2.2
  cloudinary_public: ^0.23.1
  file_picker: ^11.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.2
  geolocator: ^14.0.2

  # for notification remainder
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  
  # for ai chat
  flutter_gemini: ^3.0.0
  dash_chat_2: ^0.0.21
  flutter_markdown_plus: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Load the .env file as an asset so flutter_dotenv can read it
  assets:
    - .env
    - assets/images/
